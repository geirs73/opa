---
cases:
  - note: "logic_op/and/basic: both operands true"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          true and true
        }
    want_result:
      - x: true
  - note: "logic_op/and/basic: lhs false"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          false and true
        }
    want_result: []
  - note: "logic_op/and/basic: rhs false"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          true and false
        }
    want_result: []
  - note: "logic_op/and/basic: both false"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          false and false
        }
    want_result: []
  - note: "logic_op/and/basic: both succeed via input"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          input.x > 0 and input.y > 0
        }
    input:
      x: 1
      "y": 2
    want_result:
      - x: true
  - note: "logic_op/and/basic: lhs undefined ref"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          input.missing and input.y > 0
        }
    input:
      "y": 2
    want_result: []
  - note: "logic_op/and/basic: rhs undefined ref"
    experimental_keywords: true
    query: data.test.p = x
    modules:
      - |
        package test
        import future.keywords.and

        p if {
          input.x > 0 and input.missing
        }
    input:
      x: 1
    want_result: []
